<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixoo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  img { image-rendering: pixelated; display: block; }
  #full { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* Screen: drawn on a canvas in whole device pixels (see render()), so every LED is the same size. */
  #screen { display: block; }
  /* #ffc428 = GOLD in retro_pixoo/render.py */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 6px; background: #222; }
  #fill { height: 100%; width: 0; background: #ffc428; }
  /* Filmstrip: one horizontal row, the selected page is scrolled to the middle. */
  #grid { --cell: 256px; position: fixed; inset: 0; overflow: hidden; box-sizing: border-box;
          display: flex; align-items: center; gap: 16px; padding: 0 calc(50vw - var(--cell) / 2); }
  #grid img { flex: none; width: var(--cell); height: var(--cell); box-sizing: border-box; cursor: pointer; outline-offset: 0; }
  #grid img.sel { outline: 3px solid #ffc428; }
  #pause { position: fixed; right: 12px; bottom: 14px; color: #ffc428; font: 12px/1 monospace; letter-spacing: 1px; display: none; }
  body.paused #pause { display: block; }
  body.grid #full, body.grid #bar, body.grid #pause { display: none; }
  body:not(.grid) #grid { display: none; }
</style>
</head>
<body>
<div id="full"><canvas id="screen"></canvas></div>
<div id="bar"><div id="fill"></div></div>
<div id="pause">PAUSED</div>
<div id="grid"></div>
<script>
(() => {
  const screen = document.getElementById("screen");
  const ctx = screen.getContext("2d");
  const probe = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
  const art = new Image();
  let pixels = null;
  const fill = document.getElementById("fill");
  const grid = document.getElementById("grid");
  let pages = [], seconds = 30, generated = "", idx = 0;
  let gridMode = false, elapsed = 0, last = null, paused = false;

  // URL hash: #slide=3 (1-based) and an optional &paused, e.g. #slide=3&paused
  function readHash() {
    const h = new URLSearchParams(location.hash.slice(1));
    const n = parseInt(h.get("slide"), 10);
    if (n >= 1) idx = n - 1;
    paused = h.has("paused");
    document.body.classList.toggle("paused", paused);
  }
  function writeHash() {
    if (!pages.length) return;
    const h = new URLSearchParams({ slide: String(idx + 1) });
    if (paused) h.set("paused", "1");
    history.replaceState(null, "", "#" + h.toString());
  }
  function togglePause() {
    paused = !paused;
    document.body.classList.toggle("paused", paused);
    last = null;
    writeHash();
  }
  readHash();

  const url = p => generated ? p + "?v=" + encodeURIComponent(generated) : p;

  function show() {
    if (pages.length) {
      const u = url(pages[idx]);
      if (art.complete && art.getAttribute("src") === u) render(); else art.src = u;
      screen.style.visibility = "";
    } else { pixels = null; screen.style.visibility = "hidden"; }
    writeHash();
  }

  // 64x64 art in a 68x68 frame (2-pixel margin). Each LED is `c` whole device pixels with a dark gap,
  // so the grid is even at any zoom (the old CSS overlay drifted against the scaled image).
  art.onload = () => {
    probe.canvas.width = probe.canvas.height = 64;
    probe.drawImage(art, 0, 0, 64, 64);
    pixels = probe.getImageData(0, 0, 64, 64).data;
    render();
  };
  function render() {
    if (!pixels) return;
    const dpr = window.devicePixelRatio || 1;
    const c = Math.max(1, Math.floor(Math.min(innerWidth, innerHeight) * dpr / 68));
    const gap = c >= 8 ? Math.round(c / 8) : c >= 4 ? 1 : 0;
    screen.width = screen.height = 68 * c;
    screen.style.width = screen.style.height = (68 * c / dpr) + "px";
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 68 * c, 68 * c);
    ctx.fillStyle = "#08080a"; ctx.fillRect(2 * c, 2 * c, 64 * c, 64 * c);
    for (let y = 0; y < 64; y++) {
      for (let x = 0; x < 64; x++) {
        const o = (y * 64 + x) * 4;
        ctx.fillStyle = "rgb(" + pixels[o] + "," + pixels[o + 1] + "," + pixels[o + 2] + ")";
        ctx.fillRect((x + 2) * c + gap, (y + 2) * c + gap, c - gap, c - gap);
      }
    }
  }
  window.addEventListener("resize", render);

  function buildGrid() {
    grid.textContent = "";
    pages.forEach((p, i) => {
      const im = document.createElement("img");
      im.src = url(p);
      im.alt = "";
      im.addEventListener("click", () => { idx = i; exitGrid(); });
      grid.appendChild(im);
    });
    markSel();
  }

  function markSel() {
    [...grid.children].forEach((c, i) => c.classList.toggle("sel", i === idx));
    const c = grid.children[idx];
    if (gridMode) center(true);
    writeHash();
  }

  function center(smooth) {
    const c = grid.children[idx];
    if (!c) return;
    grid.scrollTo({ left: c.offsetLeft + c.offsetWidth / 2 - grid.clientWidth / 2,
                    behavior: smooth ? "smooth" : "instant" });
  }

  function restart() { elapsed = 0; last = null; fill.style.width = "0"; }

  function go(d) {
    if (!pages.length) return;
    idx = (idx + d + pages.length) % pages.length;
    show(); restart();
  }

  function enterGrid() { gridMode = true; document.body.classList.add("grid"); markSel(); center(false); }
  function exitGrid() { gridMode = false; document.body.classList.remove("grid"); show(); restart(); }

  function moveSel(d) {
    if (!pages.length) return;
    idx = (idx + d + pages.length) % pages.length;
    markSel();
  }

  document.addEventListener("keydown", e => {
    if (e.altKey || e.metaKey || e.ctrlKey) return;
    const k = e.key;
    if (k === "p" || k === "P" || k === " ") { togglePause(); e.preventDefault(); return; }
    if (gridMode) {
      if (k === "ArrowRight") moveSel(1);
      else if (k === "ArrowLeft") moveSel(-1);
      else if (k === "ArrowDown") exitGrid();
      else if (k === "Enter" || k === "Escape") exitGrid();
      else return;
    } else {
      if (k === "ArrowRight") go(1);
      else if (k === "ArrowLeft") go(-1);
      else if (k === "ArrowUp" || k === "Enter" || k === "Escape") enterGrid();
      else return;
    }
    e.preventDefault();
  });

  function tick(ts) {
    if (!gridMode && !paused && pages.length > 0) {
      if (last !== null) elapsed += (ts - last) / 1000;
      last = ts;
      if (elapsed >= seconds) go(1);
      fill.style.width = Math.min(100, elapsed / seconds * 100) + "%";
    } else {
      last = null;
    }
    requestAnimationFrame(tick);
  }

  let retry = null;
  async function load() {
    try {
      const r = await fetch("manifest.json", { cache: "no-store" });
      if (!r.ok) throw new Error("manifest " + r.status);
      const m = await r.json();
      const np = Array.isArray(m.pages) ? m.pages : [];
      const ns = Number(m.seconds) > 0 ? Number(m.seconds) : 30;
      const ng = m.generated || "";
      const changed = JSON.stringify(np) !== JSON.stringify(pages) || ng !== generated;
      seconds = ns;
      if (!changed) return;
      pages = np; generated = ng;
      idx = pages.length ? Math.min(idx, pages.length - 1) : 0;
      buildGrid();
      if (!gridMode) show();
    } catch (e) { /* keep showing last good data */ }
    finally {
      // No pages yet (fetch failed or empty manifest): retry soon, then rely on the hourly refresh.
      if (!pages.length && !retry) retry = setTimeout(() => { retry = null; load(); }, 30 * 1000);
    }
  }

  window.addEventListener("hashchange", () => {
    const before = idx;
    readHash();
    idx = pages.length ? Math.min(idx, pages.length - 1) : idx;
    if (idx !== before && !gridMode) { show(); restart(); }
    else if (gridMode) markSel();
    last = null;
  });

  load();
  setInterval(load, 3600 * 1000);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
