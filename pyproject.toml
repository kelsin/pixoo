[project]
name = "retro-pixoo"
version = "0.1.0"
description = "RetroAchievements and Letterboxd pages for the Divoom Pixoo-64"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "requests>=2.28",
]

[project.scripts]
retro-pixoo = "retro_pixoo.__main__:main"
retro-pixoo-update = "retro_pixoo.update:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
