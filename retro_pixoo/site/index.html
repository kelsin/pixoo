<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixoo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  img { image-rendering: pixelated; display: block; }
  #full { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #full img { width: min(100vw, 100vh); height: min(100vw, 100vh); }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 6px; background: #222; }
  #fill { height: 100%; width: 0; background: #fff; }
  #grid { position: fixed; inset: 0; overflow-y: auto; padding: 12px; box-sizing: border-box;
          display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; align-content: start; }
  #grid img { width: 100%; aspect-ratio: 1; box-sizing: border-box; cursor: pointer; outline-offset: 0; }
  #grid img.sel { outline: 3px solid #fff; }
  body.grid #full, body.grid #bar { display: none; }
  body:not(.grid) #grid { display: none; }
</style>
</head>
<body>
<div id="full"><img id="main" alt=""></div>
<div id="bar"><div id="fill"></div></div>
<div id="grid"></div>
<script>
(() => {
  const main = document.getElementById("main");
  const fill = document.getElementById("fill");
  const grid = document.getElementById("grid");
  let pages = [], seconds = 30, generated = "", idx = 0;
  let gridMode = false, elapsed = 0, last = null;

  const url = p => generated ? p + "?v=" + encodeURIComponent(generated) : p;

  function show() {
    if (pages.length) { main.src = url(pages[idx]); main.style.visibility = ""; }
    else { main.removeAttribute("src"); main.style.visibility = "hidden"; }
  }

  function buildGrid() {
    grid.textContent = "";
    pages.forEach((p, i) => {
      const im = document.createElement("img");
      im.src = url(p);
      im.alt = "";
      im.addEventListener("click", () => { idx = i; exitGrid(); });
      grid.appendChild(im);
    });
    markSel();
  }

  function markSel() {
    [...grid.children].forEach((c, i) => c.classList.toggle("sel", i === idx));
    const c = grid.children[idx];
    if (gridMode && c) c.scrollIntoView({ block: "nearest" });
  }

  function restart() { elapsed = 0; last = null; fill.style.width = "0"; }

  function go(d) {
    if (!pages.length) return;
    idx = (idx + d + pages.length) % pages.length;
    show(); restart();
  }

  function enterGrid() { gridMode = true; document.body.classList.add("grid"); markSel(); }
  function exitGrid() { gridMode = false; document.body.classList.remove("grid"); show(); restart(); }

  function columns() {
    const k = grid.children;
    if (!k.length) return 1;
    const top = k[0].offsetTop;
    let n = 0;
    while (n < k.length && k[n].offsetTop === top) n++;
    return n;
  }

  function moveSel(d) {
    if (!pages.length) return;
    idx = (idx + d + pages.length) % pages.length;
    markSel();
  }

  document.addEventListener("keydown", e => {
    const k = e.key;
    if (gridMode) {
      if (k === "ArrowRight") moveSel(1);
      else if (k === "ArrowLeft") moveSel(-1);
      else if (k === "ArrowUp") {
        const t = idx - columns();
        if (t >= 0) idx = t;
        markSel();
      }
      else if (k === "ArrowDown") exitGrid();
      else if (k === "Enter") exitGrid();
      else return;
    } else {
      if (k === "ArrowRight") go(1);
      else if (k === "ArrowLeft") go(-1);
      else if (k === "ArrowUp") enterGrid();
      else return;
    }
    e.preventDefault();
  });

  function tick(ts) {
    if (!gridMode && pages.length > 0) {
      if (last !== null) elapsed += (ts - last) / 1000;
      last = ts;
      if (elapsed >= seconds) go(1);
      fill.style.width = Math.min(100, elapsed / seconds * 100) + "%";
    } else {
      last = null;
    }
    requestAnimationFrame(tick);
  }

  async function load() {
    try {
      const r = await fetch("manifest.json", { cache: "no-store" });
      if (!r.ok) return;
      const m = await r.json();
      const np = Array.isArray(m.pages) ? m.pages : [];
      const ns = Number(m.seconds) > 0 ? Number(m.seconds) : 30;
      const ng = m.generated || "";
      const changed = JSON.stringify(np) !== JSON.stringify(pages) || ng !== generated;
      seconds = ns;
      if (!changed) return;
      pages = np; generated = ng;
      idx = pages.length ? Math.min(idx, pages.length - 1) : 0;
      buildGrid();
      if (!gridMode) show();
    } catch (e) { /* keep showing last good data */ }
  }

  load();
  setInterval(load, 3600 * 1000);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
