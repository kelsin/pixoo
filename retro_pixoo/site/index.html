<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixoo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  img { image-rendering: pixelated; display: block; }
  #full { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* Screen = 64x64 art plus a 2-pixel margin on every side (68 art-pixels square). */
  #screen { --s: calc(min(100vw, 100vh) * 64 / 68); position: relative; width: var(--s); height: var(--s); }
  #screen img { width: 100%; height: 100%; }
  /* LED look: a dark line between pixels, 1/8 of a pixel wide like retro_pixoo.render.led_preview. */
  #screen::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(to right, #08080a 12.5%, transparent 12.5%),
                      linear-gradient(to bottom, #08080a 12.5%, transparent 12.5%);
    background-size: calc(100% / 64) calc(100% / 64); }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 6px; background: #222; }
  #fill { height: 100%; width: 0; background: #fff; }
  /* Filmstrip: one horizontal row, the selected page is scrolled to the middle. */
  #grid { --cell: 240px; position: fixed; inset: 0; overflow: hidden; box-sizing: border-box;
          display: flex; align-items: center; gap: 16px; padding: 0 calc(50vw - var(--cell) / 2); }
  #grid img { flex: none; width: var(--cell); height: var(--cell); box-sizing: border-box; cursor: pointer; outline-offset: 0; }
  #grid img.sel { outline: 3px solid #fff; }
  body.grid #full, body.grid #bar { display: none; }
  body:not(.grid) #grid { display: none; }
</style>
</head>
<body>
<div id="full"><div id="screen"><img id="main" alt=""></div></div>
<div id="bar"><div id="fill"></div></div>
<div id="grid"></div>
<script>
(() => {
  const main = document.getElementById("main");
  const fill = document.getElementById("fill");
  const grid = document.getElementById("grid");
  let pages = [], seconds = 30, generated = "", idx = 0;
  let gridMode = false, elapsed = 0, last = null;

  const url = p => generated ? p + "?v=" + encodeURIComponent(generated) : p;

  function show() {
    if (pages.length) { main.src = url(pages[idx]); main.style.visibility = ""; }
    else { main.removeAttribute("src"); main.style.visibility = "hidden"; }
  }

  function buildGrid() {
    grid.textContent = "";
    pages.forEach((p, i) => {
      const im = document.createElement("img");
      im.src = url(p);
      im.alt = "";
      im.addEventListener("click", () => { idx = i; exitGrid(); });
      grid.appendChild(im);
    });
    markSel();
  }

  function markSel() {
    [...grid.children].forEach((c, i) => c.classList.toggle("sel", i === idx));
    const c = grid.children[idx];
    if (gridMode) center(true);
  }

  function center(smooth) {
    const c = grid.children[idx];
    if (!c) return;
    grid.scrollTo({ left: c.offsetLeft + c.offsetWidth / 2 - grid.clientWidth / 2,
                    behavior: smooth ? "smooth" : "instant" });
  }

  function restart() { elapsed = 0; last = null; fill.style.width = "0"; }

  function go(d) {
    if (!pages.length) return;
    idx = (idx + d + pages.length) % pages.length;
    show(); restart();
  }

  function enterGrid() { gridMode = true; document.body.classList.add("grid"); markSel(); center(false); }
  function exitGrid() { gridMode = false; document.body.classList.remove("grid"); show(); restart(); }

  function moveSel(d) {
    if (!pages.length) return;
    idx = (idx + d + pages.length) % pages.length;
    markSel();
  }

  document.addEventListener("keydown", e => {
    if (e.altKey || e.metaKey || e.ctrlKey) return;
    const k = e.key;
    if (gridMode) {
      if (k === "ArrowRight") moveSel(1);
      else if (k === "ArrowLeft") moveSel(-1);
      else if (k === "ArrowDown") exitGrid();
      else if (k === "Enter") exitGrid();
      else return;
    } else {
      if (k === "ArrowRight") go(1);
      else if (k === "ArrowLeft") go(-1);
      else if (k === "ArrowUp") enterGrid();
      else return;
    }
    e.preventDefault();
  });

  function tick(ts) {
    if (!gridMode && pages.length > 0) {
      if (last !== null) elapsed += (ts - last) / 1000;
      last = ts;
      if (elapsed >= seconds) go(1);
      fill.style.width = Math.min(100, elapsed / seconds * 100) + "%";
    } else {
      last = null;
    }
    requestAnimationFrame(tick);
  }

  let retry = null;
  async function load() {
    try {
      const r = await fetch("manifest.json", { cache: "no-store" });
      if (!r.ok) throw new Error("manifest " + r.status);
      const m = await r.json();
      const np = Array.isArray(m.pages) ? m.pages : [];
      const ns = Number(m.seconds) > 0 ? Number(m.seconds) : 30;
      const ng = m.generated || "";
      const changed = JSON.stringify(np) !== JSON.stringify(pages) || ng !== generated;
      seconds = ns;
      if (!changed) return;
      pages = np; generated = ng;
      idx = pages.length ? Math.min(idx, pages.length - 1) : 0;
      buildGrid();
      if (!gridMode) show();
    } catch (e) { /* keep showing last good data */ }
    finally {
      // No pages yet (fetch failed or empty manifest): retry soon, then rely on the hourly refresh.
      if (!pages.length && !retry) retry = setTimeout(() => { retry = null; load(); }, 30 * 1000);
    }
  }

  load();
  setInterval(load, 3600 * 1000);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
